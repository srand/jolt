# Scheduler configuration for the docker compose deployment.
#
# The listen addresses keep their defaults (tcp://:9090 for gRPC, tcp://:8080
# for HTTP); only the public address needs stating.
#
# public_http is the address the scheduler hands out to clients in each task's
# log URL, so it has to be reachable by whoever reads those logs — the
# dashboard. This deployment publishes the scheduler's HTTP port on the host,
# and `jolt run` starts only cache, scheduler and worker, leaving the dashboard
# to run outside the compose network. So the host address is the right one.
#
# If you instead run the dashboard as a service inside this compose project,
# change this to http://scheduler:8080 — "localhost" inside that container
# would be the dashboard itself.
public_http:
  - http://localhost:8080

# Without an explicit size the stash keeps nothing: LogStashConfig.SetDefaults
# leaves it at 0, and the LRU treats 0 as zero capacity rather than unbounded,
# so each log is deleted the moment its task finishes and the writer closes.
# The log is readable while the task runs — an open writer is held out of the
# LRU — which makes the loss look like it only affects completed tasks.
#
# Storage here is in memory (the default), so this is RAM, not disk.
logstash:
  size: 1GB
