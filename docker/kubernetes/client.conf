[jolt]
# Disable artifact upload in local builds.
# This is overridden when running a distributed network build.
# It can be overridden on the command line with the --upload flag.
upload = false

[cache]
# Location of the Jolt cache service.
# Replace 'localhost' with the hostname or IP of the cache in your deployment.
http_uri = http://<cache-host>:8080
grpc_uri = tcp://<cache-host>:9090
# Token of the cache, if the cache requires authentication.
# token = <users token>

[scheduler]
# Location of the Jolt scheduler.
# Replace 'localhost' with the hostname or IP of the scheduler your deployment.
grpc_uri = tcp://<scheduler-host>:9090
http_uri = http://<scheduler-host>:8080
# Token of the scheduler, if the scheduler requires authentication.
# token = <users token>

# Users may instead sign in with `jolt login` to an OpenID Connect provider
# that the services accept tokens from:
# [auth]
# issuer = https://keycloak.example.com/realms/jolt

# Tokens are only sent over TLS, with https:// and tls:// URIs above, unless
# this is enabled. ca_cert gives the certificate of a private authority.
# [jolt]
# allow_insecure_token = true
# ca_cert = /etc/ssl/jolt-ca.pem
